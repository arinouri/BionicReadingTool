<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Line Highlighting | Read Easier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/highlight.css">
</head>
<body class="dark">

  <header class="tool-header">
    <a href="../index.html" class="brand-link">← Read Easier</a>
    <button id="modeToggle" type="button" onclick="toggleTheme()" aria-label="Toggle light and dark">🌙</button>
  </header>

  <main>
    <h1>Line Highlighting</h1>
    <p>Paste or type your text. Load lines, then move the highlight up or down to stay focused.</p>

    <textarea id="highlightInput" placeholder="Paste text here, with each sentence or line on a new line..."></textarea>

    <div class="controls">
      <button onclick="loadLines()">Load lines</button>
      <button onclick="prevLine()">⬆ Previous line</button>
      <button onclick="nextLine()">⬇ Next line</button>
    </div>

    <div class="highlight-box" id="highlightBox">
      Paste your text and click "Load lines" to begin.
    </div>

    <a href="../index.html">← Back to Read Easier Home</a>

    <footer>
      &copy; 2025 Read Easier | Keep your place 🟩
    </footer>
  </main>

  <script src="./js/highlight.js"></script>
</body>
</html>
